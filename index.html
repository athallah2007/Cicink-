<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="rotate-overlay">
        <div class="rotate-content">
            <svg class="phone-icon" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#7a8b7d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
            <h2>Please rotate your device</h2>
            <p>To experience this moment, view in landscape mode.</p>
        </div>
    </div>

    <div id="curtain-left" class="curtain left"></div>
    <div id="curtain-right" class="curtain right"></div>

    <audio id="sound-effect" src="https://actions.google.com/sounds/v1/water/water_drop.ogg" preload="auto"></audio>

    <!-- VIDEO OVERLAY (Tombol 3) -->
    <div id="video-overlay" class="video-overlay">
        <button class="close-video" onclick="closeVideo()">Close</button>
        <video id="my-video" playsinline loop>
            <source src="video.mp4
            " type="video/mp4">
            Your browser does not support HTML video.
        </video>
    </div>

    <!-- HALAMAN UTAMA (HOME) -->
    <div id="page1" class="wrapper">
        <h1 class="title">To My Cicink,</h1>
        <p class="subtitle">A small piece of my universe, dedicated entirely to you.</p>
        
        <div class="action-group">
            <button onclick="mulaiGameAboutMe()">About Me Quiz</button>   
            <button onclick="mulaiGameOurStory()">Our Story Quiz</button>  
            <button onclick="playVideo()">Our Journey</button>            
        </div>

        <div id="display-text" class="message-area"></div>
    </div>

    <!-- HALAMAN MINI GAME KUIS -->
    <div id="page-game" class="wrapper" style="display: none;">
        <div id="quiz-container">
            
            <!-- Karakter Animasi SVG Interaktif -->
            <div class="character-wrapper">
                <svg id="cute-character" viewBox="0 0 120 120" width="100" height="100">
                    <!-- Kepala / Wajah -->
                    <circle cx="60" cy="60" r="50" fill="#fce4ec" stroke="#c98a8a" stroke-width="3" />
                    <!-- Pipi Merona -->
                    <circle cx="38" cy="70" r="8" fill="#f8bbd0" opacity="0.6" class="blush" />
                    <circle cx="82" cy="70" r="8" fill="#f8bbd0" opacity="0.6" class="blush" />
                    <!-- Mata Kiri & Kanan -->
                    <g id="char-eyes">
                        <circle cx="42" cy="50" r="5" fill="#4a5d4e" />
                        <circle cx="78" cy="50" r="5" fill="#4a5d4e" />
                    </g>
                    <!-- Mulut (Dinamis via CSS/JS) -->
                    <path id="char-mouth" d="M 45 75 Q 60 90 75 75" fill="none" stroke="#4a5d4e" stroke-width="3" stroke-linecap="round" />
                </svg>
            </div>
            
            <h2 class="title" id="quiz-title" style="font-size: 2.2rem; margin-top: 10px;">Mini Quiz</h2>
            <p class="subtitle" id="question-text" style="margin-bottom: 25px;">Pertanyaan akan muncul di sini...</p>
            
            <div id="options-group" class="action-group" style="flex-direction: column; gap: 12px; max-width: 450px; margin: 0 auto 30px auto;">
                <!-- Pilihan jawaban digenerate otomatis -->
            </div>
        </div>

        <!-- Hasil Skor Game -->
        <div id="quiz-result" style="display: none;">
            <div style="font-size: 4rem; margin-bottom: 15px;" class="result-bounce">💖</div>
            <h2 class="title" style="font-size: 3rem;">Quiz Completed</h2>
            <p class="message-area" id="result-text" style="opacity: 1; transform: translateY(0); margin-bottom: 30px;"></p>
        </div>

        <div class="action-group" style="margin-top: 20px;">
            <button id="btn-back-game" onclick="keluarGame()">Exit to Home</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
